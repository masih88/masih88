name: CI

on:
  push:
    branches: [main, elektrorechner]
  pull_request:

jobs:
  core:
    name: Kern + Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DELC_BUILD_APP=OFF
      - name: Build
        run: cmake --build build --config Release
      # Test-Programm direkt starten: ctest reicht unter Windows Testnamen mit Sonderzeichen (φ, ², →)
      # in der falschen Codepage an Catch2 weiter ("No test cases matched").
      - name: Test
        shell: bash
        run: |
          exe=build/tests/elc_tests
          if [ -f build/tests/Release/elc_tests.exe ]; then exe=build/tests/Release/elc_tests.exe; fi
          "$exe"

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DELC_SANITIZE=ON -DELC_BUILD_APP=OFF
      - run: cmake --build build
      - run: ./build/tests/elc_tests
